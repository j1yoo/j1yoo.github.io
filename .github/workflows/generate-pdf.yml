name: Generate CV preview artifact

on:
  workflow_dispatch:  # On-push CV generation belongs to deploy.yml.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            ca-certificates fonts-liberation fonts-noto-cjk libx11-6 libxcomposite1 libxcursor1 \
            libxdamage1 libxext6 libxfixes3 libxi6 libxtst6 libnss3 libglib2.0-0 \
            libasound2t64 libxrandr2 libpangocairo-1.0-0 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 \
            libnspr4 libpango-1.0-0 lsb-release wget xdg-utils

      - name: Install Dependencies
        run: |
          pip3 install --upgrade nbconvert
          npm ci
          bundle install

      - name: Build Site
        run: bundle exec jekyll build

      - name: Generate PDF
        run: |
          bundle exec ruby _scripts/check_cv_sources.rb
          npm run pdf

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-preview-${{ github.sha }}
          path: assets/pdf/cv_jaewon.pdf
          if-no-files-found: error
