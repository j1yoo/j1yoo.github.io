# Data catalog: datasets held / used by the CADI Lab.
# Rendered publicly at /data/ AND designed to be machine-readable for research
# pipeline agents (single source of truth — edit here only).
#
# NOTE: the entries below are PLACEHOLDER EXAMPLES showing the schema.
# Replace them with real datasets before merging to main.
#
# Fields:
#   name        — dataset name (required)
#   category    — grouping on the page, e.g. "Platform & Field Data",
#                 "Experimental Data", "Public & Archival Data" (required)
#   status      — one of: public | on-request | proprietary (required)
#                 public:      data itself is openly downloadable (give link)
#                 on-request:  description public, data shared upon reasonable request
#                 proprietary: existence/description public, data not shareable (NDA etc.)
#   source      — where the data comes from (platform, partner, collection method)
#   period      — time coverage, e.g. "2021-01 ~ 2023-12"
#   unit        — unit of analysis / granularity, e.g. "user-session-ad impression"
#   size        — approximate scale, e.g. "~2.1M impressions, 180K users"
#   description — 2-4 sentences: what it captures, what makes it useful
#   link        — optional URL (repository, paper, documentation)
#   related     — optional list of {text, url} for related papers/projects
#   keywords    — optional list, used by students/agents to search the catalog

