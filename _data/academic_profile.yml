reviewed_on: 2026-09-15
research_question: "How do platform and technology design choices shape user/consumer behavior and market outcomes through frictions in decision-making and execution, such as search and evaluation costs, transaction costs, uncertainty, and attention allocation?"
cv_research_summary: "I study how platform and technology design shape consumer behavior and market and societal outcomes through changes in decision-making frictions. My research spans marketing and innovation in digital markets and services, using field experiments and quasi-experimental causal inference, with complementary work on counterfactual reasoning and explainable AI."
