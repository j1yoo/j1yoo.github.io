- name: Pei-Jou (Pearl) Lin
  year: 2023-25
  info: "Institute of Service Science, National Tsing Hua University (NTHU)"

  thesis: "Effects of Paid Family Leave Policy on Firm Risk-Taking: A Quasi-Experimental Approach"
  status: "In Progress"
  degree: "Masters"
  thesis_url: https://etd.lib.nthu.edu.tw/detail/c25e999348b0136aceab80dc25d730b2/
  abstract: "This study examines how state-level Paid Family Leave (PFL) policies in the United States affect firm strategic risk-taking. Although PFL programs are primarily designed to support employees, firms may perceive such policies as regulatory shocks, interpreting them either as threats that introduce operational uncertainty and short-term costs or as opportunities to enhance workforce stability. Drawing on the threat–opportunity categorization framework, Upper Echelon Theory (UET), and the Behavioral Agency Model (BAM), this study develops competing hypotheses regarding the direction of firms’ strategic responses to PFL adoption. Using panel data on publicly listed U.S. manufacturing firms from 2002 to 2019, the study exploits the staggered rollout of PFL across states as a quasi-natural experiment. It applies both conventional two-way fixed effects (TWFE) and the staggered Difference-in-Differences (DiD) estimator by Callaway and Sant’Anna (2021), which accounts for variation in treatment timing and heterogeneous effects. The results consistently show that PFL adoption is associated with increased strategic risk-taking, as measured by a standardized composite factor score of R&D investment, capital expenditures, and long-term debt. This suggests that managers may view PFL as a short-term threat and respond by taking greater risks. However, the effect is significantly weaker among small and medium-sized enterprises (SMEs), possibly due to resource constraints and operational vulnerabilities. These findings highlight how pro-employee social policies can shape firm behavior, offering important insights for both managers and policymakers navigating regulatory change."

- name: Natasha Carissa Tedjasukmana
  year: 2023-25
  info: "iMBA, National Tsing Hua University (NTHU)"

  thesis: "Unintended Consequences of Sales Ban: Empirical Analysis of the Book Retailing Industry"
  status: "In Progress"
  degree: "Masters"
  thesis_url: https://etd.lib.nthu.edu.tw/detail/12ad09d982483923e9982de20ed0191c/
  abstract: "This thesis examines the unintended consequences of the 2008 book ban imposed by the South Korean government on 23 book titles. While book bans are typically intended to suppress the circulation of certain books, they can also increase public attention to the banned books, hence resulting in a reactance phenomenon. Using a panel dataset of monthly book sales from a major South Korean bookstore, this study applies a Difference-in-Differences (DiD) framework using a Two-Way Fixed Effects (TWFE) model to estimate the causal impact of the ban on the sales performance of the banned books compared to non-banned books before and after the ban. The analysis also explores the spillover effect on genre, as well as heterogeneity effects of different buyer characteristics, such as conscription eligibility, gender, political regionalism, and regional GDP. The results suggest that, rather than suppressing demand, the book ban in fact significantly stimulated sales for the banned books. These findings contribute to the literature on consumer behavior and policymaking."

- name: Medjine Nestant
  year: 2023-25
  info: "iMBA, National Tsing Hua University (NTHU)"

  thesis: "When Algorithms Go Silent: Effects of Trending Topic Suspension on Political Information Consumption"
  status: "In Progress"
  degree: "Masters"
  thesis_url: https://etd.lib.nthu.edu.tw/detail/252b0089ebe61c7618327accc66ba0ec/
  abstract: "This thesis investigates how the temporary removal of algorithmic amplification, specifically the suspension of trending topics features, impacts citizens’ engagement with political news on major Korean portal platforms during the April 2020 legislative elections. Employing a quasi-natural experimental design and leveraging user-level panel interaction data from over 2,000 users across the two major platforms, the study applies a difference-in-differences framework, supplemented with triple differences, event studies, and machine learning–assisted robustness checks. Results indicate that suspending trending topics significantly reduced user engagement with political articles, particularly among heavy users, without corresponding increases in content diversity or declines in engagement volatility. These findings offer empirical support for the proposition that algorithmic infrastructure influences not just content visibility, but also political attention allocation. Theoretically, the thesis contributes to agenda-setting theory in digital environments and emphasizes the political consequences of de-amplification. Normatively, it raises design questions about democratic information flows, especially in contexts of state–platform interaction. Robustness checks suggest that the effects are not artifacts of selection bias or time-varying confounders."

